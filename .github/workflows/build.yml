name: Build APK from www

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "PATH=${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}" >> $GITHUB_ENV

      - name: Accept Android SDK licenses
        run: |
          set -e
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "sdkmanager not found at $SDKMANAGER"
            ls -la "$ANDROID_SDK_ROOT" || true
          fi

      - name: Debug environment versions
        run: |
          java -version || true
          node -v || true
          npm -v || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova project if missing
        run: |
          if [ ! -d app ]; then
            cordova create app com.aiivoapps.musicas Musicas
          fi

      - name: Add Android platform (idempotent)
        run: |
          set -e
          cd app
          # prefer a known cordova-android version for stability
          if ! cordova platform ls | grep -q "android"; then
            cordova platform add android@11 --save
          else
            echo "android platform already added"
          fi

      - name: Copy web assets into Cordova www
        run: |
          mkdir -p app/www
          rsync -a --delete "$GITHUB_WORKSPACE/www/" app/www/

      - name: Ensure Gradle wrapper is executable
        run: |
          if [ -f app/platforms/android/gradlew ]; then
            chmod +x app/platforms/android/gradlew || true
          fi
          if [ -f app/platforms/android/app/gradlew ]; then
            chmod +x app/platforms/android/app/gradlew || true
          fi

      - name: Build Debug APK
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/.gradle
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e
          cd app
          cordova telemetry off || true
          # first try cordova build
          cordova build android --debug --no-telemetry || true
          # then run gradle directly to get clearer errors if present
          if [ -d platforms/android ]; then
            if [ -f platforms/android/gradlew ]; then
              (cd platforms/android && ./gradlew assembleDebug --no-daemon) || true
            elif [ -f platforms/android/app/gradlew ]; then
              (cd platforms/android/app && ./gradlew assembleDebug --no-daemon) || true
            else
              echo "gradlew not found in expected locations"
              ls -la platforms/android || true
            fi
          fi

      - name: Collect APK(s)
        run: |
          mkdir -p output
          find app/platforms/android -name "*.apk" -type f -exec cp -v {} output/ \; || true
          ls -la output || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musicas-apk-${{ github.run_id }}
          path: output/*.apk
          if-no-files-found: warn
