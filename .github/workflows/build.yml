Name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create app com.exemplo.app MeuApp
          cd app
          cordova platform add android
          cp -r ../www/* www/

      - name: Build Debug APK
        run: |
          cd app
          cordova build android --debug

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          cp app/platforms/android/app/build/outputs/apk/debug/app-debug.apk output/Musicas-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musicas-debug-APK-${{ github.run_id }}
          path: output/Musicas-debug.apk
