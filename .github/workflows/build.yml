name: Build APK from www

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Android SDK
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: "33.0.0"
          components: platform-tools,platforms;android-33,build-tools;33.0.0,cmdline-tools;latest

      - name: Accept Android SDK licenses
        run: |
          set -e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "sdkmanager not found at $SDKMANAGER"
            ls -la "$ANDROID_SDK_ROOT" || true
          fi

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova project if missing
        run: |
          if [ ! -d app ]; then
            cordova create app com.aiivoapps.musicas Musicas
          fi

      - name: Add Android platform (idempotent)
        run: |
          set -e
          cd app
          # ensure platform is present
          if ! cordova platform ls | grep -q "android"; then
            cordova platform add android@latest --save
          fi

      - name: Copy web assets into Cordova www
        run: |
          mkdir -p app/www
          rsync -a --delete "$GITHUB_WORKSPACE/www/" app/www/

      - name: Build Debug APK
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/.gradle
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e
          cd app
          cordova telemetry off || true
          cordova build android --debug --no-telemetry

      - name: Collect APK(s)
        run: |
          mkdir -p output
          cp -v app/platforms/android/app/build/outputs/apk/debug/*.apk output/ || true
          cp -v app/platforms/android/build/outputs/apk/debug/*.apk output/ || true
          ls -la output || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Musicas-apk-${{ github.run_id }}
          path: output/*.apk
