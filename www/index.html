<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Music Player</title>
  
  <!-- Manifest Inline para funcionar como Web App (PWA) -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "Music Player",
    "short_name": "Player",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#0f0f12",
    "theme_color": "#1a1a20",
    "icons": [{
      "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>",
      "sizes": "192x192 512x512",
      "type": "image/svg+xml"
    }]
  }' />

  <style>
    :root {
      --bg: #0f0f12; --surface: #1a1a20; --surface2: #24242c; --border: #33333f;
      --text: #e8e8ed; --muted: #8888a0; --accent: #7c5cff;
      --folder: #f0c14b; --track: #6eb5ff; --danger: #ff4d4d; --heart: #ff4d6a;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; height: 100dvh; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      padding: 12px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-height: 52px;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; }
    .header-right {
      margin-left: auto; display: flex; flex-direction: row; align-items: center; gap: 6px; flex-shrink: 0;
    }
    #btn-settings {
      width: 46px; height: 46px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.25rem; flex-shrink: 0;
    }
    #btn-settings:active { background: var(--border); }
    #fav-filter {
      width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface2); display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #fav-filter.on { border-color: var(--heart); background: rgba(255,77,106,0.15); }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; align-items: center; background: var(--surface); flex-shrink: 0;
    }
    button {
      background: var(--surface2); color: var(--text); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; min-height: 42px;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .content { flex: 1; overflow-y: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch; }

    .tree-item {
      display: flex; align-items: center; gap: 4px; padding: 8px 4px;
      border-radius: 10px; min-height: 52px; position: relative;
    }
    .tree-item.playing { background: rgba(124, 92, 255, 0.22); }
    .twist {
      width: 24px; height: 28px; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.7rem; flex-shrink: 0;
    }
    .twist:empty { visibility: hidden; }
    .icon {
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0; cursor: pointer;
    }
    .folder > .icon { color: var(--folder); }
    .track > .icon { color: var(--track); }
    .name {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 1.05rem; font-weight: 500; padding: 10px 6px; cursor: pointer;
    }
    .meta { font-size: 0.75rem; color: var(--muted); flex-shrink: 0; margin-right: 2px; }
    .row-heart, .row-menu {
      width: 40px; height: 40px; min-width: 40px; min-height: 40px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer; border-radius: 8px; font-size: 1.2rem;
    }
    .row-menu { color: var(--muted); font-size: 1.4rem; font-weight: 700; letter-spacing: -1px; }

    .children { margin-left: 12px; border-left: 1px solid var(--border); padding-left: 4px; }
    .children.hide { display: none; }

    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .empty .big { font-size: 2.4rem; margin-bottom: 10px; }

    .h {
      width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center;
      position: relative; flex-shrink: 0;
    }
    .h svg { width: 22px; height: 22px; display: block; flex-shrink: 0; }
    .h.empty svg path { fill: none; stroke: #888; stroke-width: 1.5; }
    .h.full svg path { fill: var(--heart); stroke: var(--heart); stroke-width: 1; }
    .h.half svg path.back { fill: none; stroke: #888; stroke-width: 1.5; }
    .h.half svg path.front { fill: var(--heart); stroke: var(--heart); stroke-width: 1; clip-path: inset(0 50% 0 0); }
    .h.half { position: relative; }
    .h.half::after {
      content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 50%;
      background: var(--surface2); opacity: 0.0; pointer-events: none;
    }
    #fav-filter .h, .row-heart .h { width: 22px; height: 22px; }

    .player {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 10px 14px; padding-bottom: calc(10px + var(--safe-bottom));
      display: flex; align-items: center; gap: 10px; position: relative; flex-shrink: 0;
    }
    .progress-wrap { position: absolute; left: 0; right: 0; top: -3px; height: 3px; background: var(--border); }
    .progress-bar { height: 100%; background: var(--accent); width: 0%; }
    .player-info { flex: 1; min-width: 0; }
    .player-info .now { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-info .source { font-size: 0.72rem; color: var(--muted); }
    .player-controls { display: flex; gap: 4px; }
    .player-controls button {
      width: 42px; height: 42px; border-radius: 50%; padding: 0;
      display: flex; align-items: center; justify-content: center; min-height: 42px;
    }
    .player-controls .play {
      background: var(--accent); border-color: var(--accent); color: #fff; width: 48px; height: 48px;
    }

    .toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border); padding: 10px 16px;
      border-radius: 8px; font-size: 0.88rem; z-index: 200; display: none; max-width: 90vw;
    }
    .toast.show { display: block; }

    .menu-pop {
      position: fixed; z-index: 250; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; min-width: 180px; overflow: hidden; box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      display: none;
    }
    .menu-pop.open { display: block; }
    .menu-pop button {
      display: flex; align-items: center; gap: 10px; width: 100%; border: none; border-radius: 0;
      background: transparent; padding: 14px 16px; text-align: left; font-size: 0.95rem; min-height: 48px;
    }
    .menu-pop button:active { background: var(--border); }
    .menu-pop .red { color: var(--danger); }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; width: 100%; max-width: 320px;
    }
    .modal h3 { margin-bottom: 8px; }
    .modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; line-height: 1.4; }
    .modal .acts { display: flex; gap: 8px; justify-content: flex-end; }
  
    .vol-wrap {
      position: fixed; right: 10px; top: 56px;
      bottom: calc(72px + var(--safe-bottom)); z-index: 180;
      display: flex; flex-direction: column; align-items: center; pointer-events: none;
    }
    .vol-slider-box {
      flex: 1; width: var(--vol-w, 40px); min-width: 28px; max-width: 72px;
      overflow: hidden; opacity: 0; background: var(--surface2);
      border: 1px solid transparent; border-radius: calc(var(--vol-w, 40px) / 2);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.18s ease, border-color 0.18s, width 0.15s ease;
      padding: 0; pointer-events: none; margin-bottom: 8px; position: relative;
    }
    .vol-slider-box.open { opacity: 1; border-color: var(--border); pointer-events: auto; }
    .vol-range {
      -webkit-appearance: slider-vertical; appearance: slider-vertical;
      width: 6px; height: calc(100% - 16px); max-height: 100%; border-radius: 3px;
      background: var(--border); outline: none; writing-mode: vertical-lr; direction: rtl;
      margin: 0; padding: 0; cursor: pointer;
    }
    .vol-range::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: calc(var(--vol-w, 40px) * 0.45); height: calc(var(--vol-w, 40px) * 0.45);
      min-width: 14px; min-height: 14px; border-radius: 50%;
      background: var(--accent); border: 2px solid #fff; cursor: pointer;
    }
    .vol-range::-moz-range-thumb {
      width: calc(var(--vol-w, 40px) * 0.45); height: calc(var(--vol-w, 40px) * 0.45);
      border-radius: 50%; background: var(--accent); border: 2px solid #fff; cursor: pointer;
    }
    .vol-resize {
      position: absolute; left: -6px; top: 20%; bottom: 20%;
      width: 12px; cursor: ew-resize; pointer-events: auto; display: none;
    }
    .vol-slider-box.open .vol-resize { display: block; }
    .vol-ball {
      width: var(--vol-w, 40px); height: var(--vol-w, 40px);
      min-width: 28px; min-height: 28px; max-width: 72px; max-height: 72px;
      border-radius: 50%; background: var(--surface2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: calc(var(--vol-w, 40px) * 0.45); cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35); user-select: none; pointer-events: auto;
      flex-shrink: 0; transition: width 0.15s ease, height 0.15s ease, font-size 0.15s ease;
    }
    .vol-ball:active { background: var(--border); }

    .spatial-btn { padding: 8px 12px; min-height: 36px; font-size: 0.85rem; border-radius: 8px; }
    .spatial-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  </style>
</head>
<body>
<header>
  <h1>Music Player</h1>
  <div class="header-right">
    <div id="fav-filter" title="Filtrar favoritos"></div>
    <div id="btn-settings" title="Configurações">⚙️</div>
  </div>
</header>
<div class="main">
  <div class="toolbar" id="toolbar"></div>
  <div class="content" id="content"></div>
</div>
<div class="player">
  <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="player-info">
    <div class="now" id="now-playing">Nenhuma faixa</div>
    <div class="source" id="now-source">—</div>
  </div>
  <div class="player-controls">
    <button id="btn-prev" disabled>⏮</button>
    <button class="play" id="btn-play">▶</button>
    <button id="btn-next" disabled>⏭</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="menu-pop" id="menu-pop"></div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title">Remover?</h3>
    <p id="modal-msg"></p>
    <div class="acts">
      <button id="modal-cancel">Cancelar</button>
      <button class="danger" id="modal-ok">Remover</button>
    </div>
  </div>
</div>
<audio id="audio" preload="metadata"></audio>
<div class="vol-wrap" id="vol-wrap" style="--vol-w:48px">
  <div class="vol-slider-box" id="vol-box">
    <div class="vol-resize" id="vol-resize" title="Arraste para alargar"></div>
    <input type="range" class="vol-range" id="vol-range" min="0" max="100" value="80" orient="vertical" />
  </div>
  <div class="vol-ball" id="vol-ball" title="Volume">🔊</div>
</div>

<div class="modal-bg" id="settings-modal">
  <div class="modal" style="max-height:85vh;overflow-y:auto">
    <h3>Configurações</h3>
    <p style="margin:12px 0 8px;font-weight:600;font-size:0.9rem">Áudio espacial</p>
    <div id="spatial-modes" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      <button type="button" class="spatial-btn" data-mode="natural">Natural</button>
      <button type="button" class="spatial-btn" data-mode="3d">3D</button>
      <button type="button" class="spatial-btn" data-mode="8d">8D</button>
      <button type="button" class="spatial-btn" data-mode="16d">16D</button>
      <button type="button" class="spatial-btn" data-mode="24d">24D</button>
    </div>

    <p style="margin-bottom:6px;font-size:0.85rem;color:var(--muted)">Velocidade do movimento</p>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <input type="range" id="spatial-speed" min="1" max="100" value="40" style="flex:1">
      <span id="spatial-speed-val" style="min-width:36px;text-align:right;font-size:0.85rem">40</span>
    </div>

    <p style="margin-bottom:6px;font-size:0.85rem;color:var(--muted)">Profundidade (L ↔ R)</p>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <input type="range" id="spatial-depth" min="10" max="100" value="85" style="flex:1">
      <span id="spatial-depth-val" style="min-width:36px;text-align:right;font-size:0.85rem">85</span>
    </div>

    <p style="margin-bottom:6px;font-size:0.85rem;color:var(--muted)">Reverb</p>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
      <input type="range" id="spatial-reverb" min="0" max="100" value="25" style="flex:1">
      <span id="spatial-reverb-val" style="min-width:36px;text-align:right;font-size:0.85rem">25</span>
    </div>

    <hr style="border:none;border-top:1px solid var(--border);margin:8px 0 14px">

    <p style="margin-bottom:8px;font-weight:600;font-size:0.9rem">Largura da barra de volume</p>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <button type="button" id="vol-w-minus" style="min-width:48px;font-size:1.3rem">−</button>
      <div id="vol-w-label" style="flex:1;text-align:center;font-weight:600;font-size:1.05rem">48 px</div>
      <button type="button" id="vol-w-plus" style="min-width:48px;font-size:1.3rem">+</button>
    </div>
    <p style="font-size:0.78rem;color:var(--muted);margin-bottom:16px">O botão 🔊 acompanha a mesma proporção.</p>

    <div class="acts">
      <button id="settings-close">Fechar</button>
    </div>
  </div>
</div>

<script>
const EXT = ['.mp3','.flac','.wav','.ogg','.m4a','.aac','.wma','.opus','.aiff'];
const DB_NAME = 'music-player-db';
const STORE = 'handles';
const LS_KEY = 'music-player-state-v1';

let roots = [];
let queue = [], qi = -1, playing = false;
let onlyFav = false;
const fav = new Set();
const closed = new Set();
const audio = document.getElementById('audio');
let modalCb = null;
let dirHandles = {};

const HEART_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path class="back" d="M12 21s-6.7-4.35-9.33-7.6C.8 11.2.5 8.5 2.2 6.6 3.7 4.9 6.2 4.6 8 5.8c1.1.7 1.8 1.7 2 2.2.2-.5.9-1.5 2-2.2 1.8-1.2 4.3-.9 5.8.8 1.7 1.9 1.4 4.6-.47 6.8C18.7 16.65 12 21 12 21z"/><path class="front" d="M12 21s-6.7-4.35-9.33-7.6C.8 11.2.5 8.5 2.2 6.6 3.7 4.9 6.2 4.6 8 5.8c1.1.7 1.8 1.7 2 2.2.2-.5.9-1.5 2-2.2 1.8-1.2 4.3-.9 5.8.8 1.7 1.9 1.4 4.6-.47 6.8C18.7 16.65 12 21 12 21z"/></svg>';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function isAudio(n){ n=n.toLowerCase(); return EXT.some(function(e){ return n.endsWith(e); }); }
function tid(node, path){ if(!node._fid) node._fid = uid(); return 'fid:' + node._fid; }
function nkey(node, path){ return path + '/' + node.name + (node.id||''); }
function toast(m){
  var el=document.getElementById('toast'); el.textContent=m; el.classList.add('show');
  clearTimeout(toast.t); toast.t=setTimeout(function(){ el.classList.remove('show'); }, 2200);
}
function collect(node){
  if(node.type==='track') return [node];
  var o=[]; (node.children||[]).forEach(function(c){ o=o.concat(collect(c)); }); return o;
}
function count(node){ return collect(node).length; }

function assignFids(node){
  if(node.type==='track' && !node._fid) node._fid = uid();
  (node.children||[]).forEach(assignFids);
}

function allTrackIds(node, path){
  if(node.type==='track') return [tid(node, path)];
  var k=nkey(node,path), ids=[];
  (node.children||[]).forEach(function(c){ ids=ids.concat(allTrackIds(c,k)); });
  return ids;
}

function favState(node, path){
  var ids = allTrackIds(node, path);
  if(!ids.length) return 'empty';
  var n = ids.filter(function(id){ return fav.has(id); }).length;
  if(n===0) return 'empty';
  if(n===ids.length) return 'full';
  return 'half';
}

function heartEl(state){ return '<span class="h '+state+'">'+HEART_SVG+'</span>'; }

function setFavAll(node, path, on){
  allTrackIds(node, path).forEach(function(id){
    if(on) fav.add(id); else fav.delete(id);
  });
  saveState();
}

function toggleFav(node, path){
  var st = favState(node, path);
  setFavAll(node, path, st !== 'full');
  render();
}

function filterTree(node, path){
  if(node.type==='track') return fav.has(tid(node,path)) ? node : null;
  var k=nkey(node,path);
  var kids=(node.children||[]).map(function(c){ return filterTree(c,k); }).filter(Boolean);
  if(!kids.length) return null;
  return Object.assign({}, node, {children: kids});
}

function closeDeep(node, path, minD, d){
  d=d||0; if(node.type==='track') return;
  var k=nkey(node,path); if(d>=minD) closed.add(k);
  (node.children||[]).forEach(function(c){ closeDeep(c,k,minD,d+1); });
}

/* PERSISTENCE */
function openDB(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}

async function saveHandle(id, handle){
  try {
    var db = await openDB();
    await new Promise(function(res, rej){
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(handle, id);
      tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); };
    });
  } catch(e){}
}

async function loadHandle(id){
  try {
    var db = await openDB();
    return await new Promise(function(res, rej){
      var tx = db.transaction(STORE, 'readonly');
      var r = tx.objectStore(STORE).get(id);
      r.onsuccess = function(){ res(r.result || null); };
      r.onerror = function(){ rej(r.error); };
    });
  } catch(e){ return null; }
}

async function deleteHandle(id){
  try {
    var db = await openDB();
    await new Promise(function(res, rej){
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); };
    });
  } catch(e){}
}

function serializeNode(node){
  if(node.type==='track'){
    if(!node._fid) node._fid = uid();
    return { name: node.name, type: 'track', duration: node.duration||'—', _fid: node._fid };
  }
  return {
    name: node.name, type: 'folder', id: node.id,
    children: (node.children||[]).map(serializeNode)
  };
}

function saveState(){
  try {
    var data = {
      roots: roots.map(serializeNode),
      fav: Array.from(fav),
      closed: Array.from(closed),
      onlyFav: onlyFav,
      volume: Math.round((audio.volume||0.8)*100),
      volW: (function(){ var w=document.getElementById('vol-wrap'); if(!w) return 48; return parseFloat(getComputedStyle(w).getPropertyValue('--vol-w'))||48; })(),
      rootIds: roots.map(function(r){ return r.id; })
    };
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch(e){}
}

async function loadState(){
  var raw = localStorage.getItem(LS_KEY);
  if(!raw) return;
  try {
    var data = JSON.parse(raw);
    onlyFav = !!data.onlyFav;
    if(typeof data.volume === 'number'){
      audio.volume = data.volume/100;
      var range = document.getElementById('vol-range');
      if(range) range.value = String(data.volume);
    }
    (data.fav||[]).forEach(function(id){
      if(id && String(id).indexOf('fid:') === 0) fav.add(id);
    });
    (data.closed||[]).forEach(function(k){ closed.add(k); });

    var loaded = [];
    for(var i=0;i<(data.roots||[]).length;i++){
      var meta = data.roots[i];
      var id = meta.id || uid();
      var handle = await loadHandle(id);
      var tree = null;
      if(handle){
        dirHandles[id] = handle;
        try {
          var perm = 'granted';
          if(handle.queryPermission) perm = await handle.queryPermission({mode:'read'});
          if(perm === 'granted'){
            tree = await fromHandle(handle);
            if(tree){
              tree.id = id;
              mergeFids(tree, meta, '');
              await saveHandle(id, handle);
            }
          }
        } catch(e){}
      }
      if(!tree){
        tree = JSON.parse(JSON.stringify(meta));
        tree.id = id;
      }
      loaded.push(tree);
    }
    roots = loaded;
  } catch(e){}
}

async function ensureRootAccess(root){
  if(!root || !root.id) return false;
  var hasFiles = collect(root).some(function(t){ return !!t.file; });
  if(hasFiles) return true;

  var handle = dirHandles[root.id] || await loadHandle(root.id);
  if(!handle) return false;

  try {
    var perm = 'granted';
    if(handle.queryPermission) perm = await handle.queryPermission({mode:'read'});
    if(perm !== 'granted' && handle.requestPermission){
      perm = await handle.requestPermission({mode:'read'});
    }
    if(perm !== 'granted') return false;

    var tree = await fromHandle(handle);
    if(!tree) return false;
    var meta = serializeNode(root);
    tree.id = root.id;
    mergeFids(tree, meta, '');
    var idx = roots.findIndex(function(r){ return r.id === root.id; });
    if(idx >= 0) roots[idx] = tree;
    dirHandles[root.id] = handle;
    await saveHandle(root.id, handle);
    saveState();
    render();
    return true;
  } catch(e){ return false; }
}

function findRootOf(node){
  for(var i=0;i<roots.length;i++){
    if(roots[i] === node || (node && node.id && roots[i].id === node.id) || containsNode(roots[i], node)) return roots[i];
  }
  return roots[0] || null;
}
function containsNode(parent, target){
  if(parent === target) return true;
  if(!parent || !target) return false;
  if(parent.type==='track' && target.type==='track' && parent._fid && parent._fid === target._fid) return true;
  var ch = parent.children || [];
  for(var i=0;i<ch.length;i++){ if(containsNode(ch[i], target)) return true; }
  return false;
}
function resolveLiveNode(node, root){
  if(!node || !root) return node;
  if(node.type==='track' && node._fid){
    var found = null;
    function walk(n){
      if(found) return;
      if(n.type==='track' && n._fid === node._fid) found = n;
      (n.children||[]).forEach(walk);
    }
    walk(root);
    return found || node;
  }
  return node;
}

function mergeFids(live, meta, path){
  if(!meta) return;
  if(live.type==='track'){
    if(meta.type==='track' && meta._fid) live._fid = meta._fid;
    else if(!live._fid) live._fid = uid();
    return;
  }
  if(live.type==='folder' && meta.children){
    (live.children||[]).forEach(function(c){
      var m = (meta.children||[]).find(function(x){ return x.name===c.name && x.type===c.type; });
      mergeFids(c, m, path+'/'+live.name);
    });
  }
}

async function fromHandle(h){
  var node={name:h.name,type:'folder',children:[]};
  for await (var e of h.values()){
    if(e.kind==='directory'){ var c=await fromHandle(e); if(c) node.children.push(c); }
    else if(e.kind==='file' && isAudio(e.name)){
      var f=await e.getFile();
      node.children.push({name:e.name,type:'track',file:f,url:null,duration:'—',_fid:uid()});
    }
  }
  node.children=node.children.filter(function(c){ return c.type==='track'||(c.children&&c.children.length); });
  return node.children.length?node:null;
}

function fromInput(){
  return new Promise(function(res){
    var inp=document.createElement('input');
    inp.type='file'; inp.webkitdirectory=true; inp.multiple=true;
    inp.onchange=function(){
      if(!inp.files||!inp.files.length){ res(null); return; }
      res(fromFileList(inp.files));
    };
    inp.click();
  });
}

function fromFileList(files){
  var rootName=files[0].webkitRelativePath.split('/')[0]||'Pasta';
  var root={name:rootName,type:'folder',children:[]};
  function ensure(parts){
    var cur=root;
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      var n=(cur.children||[]).find(function(c){ return c.type==='folder'&&c.name===p; });
      if(!n){ n={name:p,type:'folder',children:[]}; cur.children=cur.children||[]; cur.children.push(n); }
      cur=n;
    }
    return cur;
  }
  for(var i=0;i<files.length;i++){
    var f=files[i]; if(!isAudio(f.name)) continue;
    var parts=f.webkitRelativePath.split('/');
    var folders=parts.slice(1,-1);
    var parent=folders.length?ensure(folders):root;
    parent.children=parent.children||[];
    parent.children.push({name:f.name,type:'track',file:f,url:null,duration:'—',_fid:uid()});
  }
  function prune(n){
    if(n.type==='track') return n;
    n.children=(n.children||[]).map(prune).filter(Boolean);
    return n.children.length?n:null;
  }
  return prune(root);
}

async function addPlaylist(){

  assignFids(tree);

    await saveHandle(root.id, handle);
  }

  render();
}

async function ensureUrl(t){
  if(t.url) return t.url;
  if(t.file){ t.url=URL.createObjectURL(t.file); return t.url; }
  return null;
}

// Otimização para troca contínua em Background (Mobile)
async function prepareNextTrack() {
  if (qi < queue.length - 1) {
    const nextTrack = queue[qi + 1];
    if (nextTrack) await ensureUrl(nextTrack);
  }
}

async function playNow(){
  if(qi<0||!queue[qi]) return;
  
  ensureAudioGraph();
  if(audioCtx && audioCtx.state==='suspended'){
    try { await audioCtx.resume(); } catch(e){}
  }
  
  var track = queue[qi];
  var url = await ensureUrl(track);
  if(!url){ toast('Sem acesso ao arquivo'); return; }
  
  try {
    audio.src = url;
    prepareNextTrack(); // Pré-aloca a próxima URL
    await audio.play();
    playing = true;
  } catch(e){
    try {
      audio.play();
      playing = true;
    } catch(err){
      playing = false;
    }
  }
  renderPlayer();
  renderContent();
  updateMediaSession();
}

async function playFolder(n){
  var root = findRootOf(n);
  if(root){
    await ensureRootAccess(root);
    root = roots.find(function(r){ return r.id === root.id; }) || root;
    n = resolveLiveNode(n, root);
  }
  var t = collect(n).filter(function(x){ return !!x.file; });
  if(!t.length){ toast('Sem acesso aos arquivos'); return; }
  queue = t; qi = 0; playNow();
}

async function playTrack(n){
  var root = findRootOf(n);
  if(root){
    await ensureRootAccess(root);
    root = roots.find(function(r){ return r.id === root.id; }) || root;
    n = resolveLiveNode(n, root);
  }
  if(!n.file){ toast('Sem acesso a este arquivo'); return; }
  queue = [n]; qi = 0; playNow();
}

function next(){
  if(qi < queue.length-1){
    qi++; playNow();
  } else {
    playing=false; try { audio.pause(); } catch(e){}
    renderPlayer(); updateMediaSession();
  }
}

function prev(){
  if(qi>0){ qi--; playNow(); }
}

function toggle(){
  if(!queue.length) return;
  if(playing){ audio.pause(); playing=false; }
  else {
    if(!audio.src&&queue[qi]) playNow();
    else audio.play().then(function(){ playing=true; renderPlayer(); }).catch(function(){});
  }
  renderPlayer();
}

function stop(){
  audio.pause(); audio.removeAttribute('src'); playing=false; queue=[]; qi=-1;
  document.getElementById('progress-bar').style.width='0%'; render();
}

function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try {
    var t = queue[qi];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t ? t.name : 'Music Player',
      artist: 'Music Player',
      album: t && t.name ? t.name : ''
    });
    navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  } catch(e){}
}
function updateMediaSessionPosition(){
  if(!('mediaSession' in navigator) || !audio.duration) return;
  try {
    navigator.mediaSession.setPositionState({
      duration: audio.duration,
      playbackRate: audio.playbackRate || 1,
      position: audio.currentTime
    });
  } catch(e){}
}

if('mediaSession' in navigator){
  try {
    navigator.mediaSession.setActionHandler('play', function(){ if(!playing) toggle(); });
    navigator.mediaSession.setActionHandler('pause', function(){ if(playing) toggle(); });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ prev(); });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ next(); });
    navigator.mediaSession.setActionHandler('stop', function(){ stop(); });
  } catch(e){}
}

function globalState(){
  if(!roots.length) return 'empty';
  var total=0, favN=0;
  function walk(node, path){
    if(node.type==='track'){
      total++; if(fav.has(tid(node, path))) favN++; return;
    }
    var k=nkey(node, path);
    (node.children||[]).forEach(function(c){ walk(c, k); });
  }
  roots.forEach(function(r){ walk(r, ''); });
  if(total===0 || favN===0) return 'empty';
  if(favN>=total) return 'full';
  return 'half';
}

function drawNode(node, path, parentArr, orig){
  orig=orig||node;
  var wrap=document.createElement('div');
  var key=nkey(orig, path);
  var kids=onlyFav ? (node.children||[]) : (orig.children||[]);
  var hasKids=kids.length>0;
  var isClosed=closed.has(key);
  var st=favState(orig, path);

  var row=document.createElement('div');
  row.className='tree-item '+(node.type||'folder');
  if(node.type==='track' && queue[qi]===orig) row.classList.add('playing');

  var twist=document.createElement('span');
  twist.className='twist';
  twist.textContent=hasKids?(isClosed?'▶':'▼'):'';
  row.appendChild(twist);

  var icon=document.createElement('span');
  icon.className='icon';
  icon.textContent=node.type==='track'?'🎵':'📁';
  row.appendChild(icon);

  var name=document.createElement('span');
  name.className='name';
  name.textContent=node.name;
  row.appendChild(name);

  if(node.type!=='track'){
    var meta=document.createElement('span');
    meta.className='meta';
    meta.textContent=count(onlyFav?node:orig);
    row.appendChild(meta);
  }

  var hbtn=document.createElement('span');
  hbtn.className='row-heart';
  hbtn.innerHTML=heartEl(st);
  hbtn.onclick=function(e){ e.stopPropagation(); toggleFav(orig, path); };
  row.appendChild(hbtn);

  var mbtn=document.createElement('span');
  mbtn.className='row-menu';
  mbtn.textContent='⋮';
  mbtn.onclick=function(e){
    e.stopPropagation();
    var isRoot=roots.indexOf(orig)>=0;
    openMenu(e, orig, path, isRoot?null:parentArr);
  };
  row.appendChild(mbtn);

  if(node.type==='track'){
    icon.onclick=name.onclick=function(e){ e.stopPropagation(); playTrack(orig); };
  } else {
    function nav(e){
      e.stopPropagation();
      if(!hasKids) return;
      if(closed.has(key)) closed.delete(key); else closed.add(key);
      saveState(); render();
    }
    icon.onclick=twist.onclick=nav;
    name.onclick=function(e){ e.stopPropagation(); playFolder(orig); };
  }

  wrap.appendChild(row);

  if(hasKids){
    var ch=document.createElement('div');
    ch.className='children'+(isClosed?' hide':'');
    kids.forEach(function(c){
      var oc=(orig.children||[]).find(function(x){ return x.name===c.name && x.type===c.type; })||c;
      ch.appendChild(drawNode(c, key, orig.children, oc));
    });
    wrap.appendChild(ch);
  }
  return wrap;
}

/* Web Audio API / Espacial */
var audioCtx = null, mediaSource = null, panNode = null, wetGain = null, dryGain = null, convolver = null;
var spatialMode = 'natural', spatialSpeed = 40, spatialDepth = 85, spatialReverb = 25, panRAF = null, panPhase = 0;

function ensureAudioGraph(){
  if(audioCtx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC();
    mediaSource = audioCtx.createMediaElementSource(audio);

    dryGain = audioCtx.createGain();
    wetGain = audioCtx.createGain();
    panNode = audioCtx.createStereoPanner();
    convolver = audioCtx.createConvolver();
    convolver.buffer = makeImpulse(audioCtx, 2.2, 2.0);

    mediaSource.connect(dryGain);
    dryGain.connect(audioCtx.destination);

    mediaSource.connect(panNode);
    panNode.connect(wetGain);
    panNode.connect(audioCtx.destination);

    wetGain.connect(convolver);
    convolver.connect(audioCtx.destination);

    applySpatialSettings();
  } catch(e) {}
}

function makeImpulse(ctx, seconds, decay){
  var rate = ctx.sampleRate, len = rate * seconds, buf = ctx.createBuffer(2, len, rate);
  for(var c=0;c<2;c++){
    var data = buf.getChannelData(c);
    for(var i=0;i<len;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay); }
  }
  return buf;
}

function baseSpeed(){
  var map = { natural:0, '3d':0.35, '8d':0.7, '16d':1.15, '24d':1.7 };
  return map[spatialMode] || 0;
}

function applySpatialSettings(){
  if(!audioCtx) return;
  var isNat = spatialMode === 'natural', depth = spatialDepth / 100, rev = spatialReverb / 100;
  if(isNat){
    dryGain.gain.value = 1; wetGain.gain.value = 0;
    if(panNode) panNode.pan.value = 0;
    stopPanAnim();
  } else {
    dryGain.gain.value = 0.35; wetGain.gain.value = 0.15 + rev * 0.55;
    startPanAnim(depth);
  }
}

function startPanAnim(depth){
  stopPanAnim();
  var last = performance.now();
  function tick(now){
    var dt = (now - last) / 1000; last = now;
    var spd = baseSpeed() * (0.25 + spatialSpeed/100 * 1.75);
    panPhase += dt * spd * Math.PI * 2;
    var pan = Math.sin(panPhase) * depth;
    if(panNode) panNode.pan.value = Math.max(-1, Math.min(1, pan));
    panRAF = requestAnimationFrame(tick);
  }
  panRAF = requestAnimationFrame(tick);
}
function stopPanAnim(){
  if(panRAF){ cancelAnimationFrame(panRAF); panRAF = null; }
  if(panNode) panNode.pan.value = 0;
}

audio.addEventListener('play', function(){
  ensureAudioGraph();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  applySpatialSettings();
});

  else if(document.visibilityState === 'visible' && audioCtx && audioCtx.state === 'suspended' && playing) {
    audioCtx.resume();
  }
});

/* Service Worker Inline para PWA */
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(function(){});
}

boot();
</script>
